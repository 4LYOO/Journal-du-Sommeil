.lk{display:inline-block;margin-top:8px;color:var(--ac);text-decoration:none;font-weight:600}
.ax{display:flex;justify-content:space-between;color:var(--mu);font-size:.75rem;margin-top:4px}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0}.stk i{display:block}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:6px}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:right;font-weight:500}td:first-child,th:first-child{text-align:left}th{color:var(--mu);font-size:.75rem}

html{scroll-behavior:smooth}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;max-width:430px;padding-left:14px;padding-right:14px}
h1{font-size:1.9rem;letter-spacing:-.03em;margin:16px 0 2px}
.card{border-radius:24px;padding:16px}.card h2{margin-bottom:12px}
input,select,textarea,.btn,.ch button{border-radius:14px}input,select{min-height:48px}
.btn{min-height:48px}a.btn{display:block;margin-top:8px;padding:13px;text-align:center;text-decoration:none;color:var(--tx);font-weight:600;border:1px solid var(--gb)}
.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.amb i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px);background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%);animation:fl 22s ease-in-out infinite alternate}
.amb i:nth-child(1){top:-20vmax;left:-20vmax}.amb i:nth-child(2){bottom:-25vmax;right:-25vmax;animation-delay:-11s;background:radial-gradient(circle,rgba(91,141,239,.16),transparent 65%)}

@keyframes fl{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes grow{from{transform:scaleY(0)}}

main{animation:none}
main.anim>*{animation:rise .55s cubic-bezier(.2,.9,.25,1.15) both}
main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(4){animation-delay:.15s}main.anim>*:nth-child(5){animation-delay:.2s}main.anim>*:nth-child(n+6){animation-delay:.25s}

button,a.btn,.ar{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .25s,border-color .25s,color .25s}

</style></head><body><div class="amb"><i></i><i></i></div>
<div class="hd"><h1>🌙 Journal du sommeil</h1><button id="th" type="button" aria-label="Thème">☀️</button></div>
<p class="st" id="mode"></p>

<main id="app"></main>
<div class="tbw"><nav class="tb"><b class="pill"></b><button id="t1" class="on"><i>✏️</i>Saisie</button><button id="t2"><i>🗓️</i>Historique</button><button id="t3"><i>📊</i>Stats</button><button id="t4"><i>📥</i>Importer</button></nav></div><div id="sv"></div>
<datalist id="dl"><option value="Donormyl"></datalist>
<script>
const KEY='sommeil-v1',$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const blank=d=>({date:d,bed:'',try:'',lat:'',wakes:'',wakeDur:'',wake:'',up:'',naps:[],sound:'',soundNote:'',soundUrl:'',odd:[],oddNote:'',meds:[],feel:'',note:''});
const clone=o=>JSON.parse(JSON.stringify(o));
let entries={},cur=blank(today()),store=null,tab=1,tmr,delArm=false,imp={text:'',blocks:null};
const ODD=['Bruit','Lumière','Inconfort','Chaleur','Froid','Stress','Écran tard','Repas tardif'];
const FEEL=['difficile','moyenne','bonne'],FC={difficile:'var(--ba)',moyenne:'var(--wa)',bonne:'var(--ok)'};
const mi=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},df=(a,b)=>((mi(b)-mi(a))+1440)%1440;
const hm=m=>m==null?'–':Math.floor(m/60)+'h'+pad(Math.round(m%60));
const fd=d=>d.split('-').reverse().join('/');
const lg=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const isFilled=e=>JSON.stringify({...e,date:''})!==JSON.stringify({...blank(''),date:''});
function stats(e){const r={inbed:null,sleep:null,eff:null};
 if(e.bed&&e.up)r.inbed=df(e.bed,e.up);
 if(e.try&&e.wake){const w=df(e.try,e.wake);r.sleep=Math.max(0,w-(+e.lat||0)-(+e.wakeDur||0))}
 if(r.sleep!=null&&r.inbed>0)r.eff=Math.min(100,Math.round(r.sleep/r.inbed*100));return r}
let stt;function setStatus(s){const e=$('#sv');e.textContent=s;e.classList.add('show');clearTimeout(stt);if(!/…$/.test(s))stt=setTimeout(()=>e.classList.remove('show'),1800)}
function touch(){clearTimeout(tmr);setStatus('Enregistrement…');tmr=setTimeout(save,600)}
async function save(){if(!isFilled(cur))return;
 entries[cur.date]=clone(cur);
 try{if(store)await store.doc(cur.date).set(entries[cur.date]);else localStorage.setItem(KEY,JSON.stringify(entries));setStatus('Enregistré ✓')}
 catch(e){setStatus('Échec de l’enregistrement, réessayez')}}
function openDate(d){cur=entries[d]?{...blank(d),...clone(entries[d])}:blank(d);delArm=false}
function medNames(){const s=new Set();Object.values(entries).forEach(e=>(e.meds||[]).forEach(m=>m.n&&s.add(m.n)));$('#dl').innerHTML='<option value="Donormyl">'+[...s].filter(x=>x!=='Donormyl').map(x=>'<option value="'+x.replace(/"/g,'&quot;')+'">').join('')}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const tm=(k,l)=>`<label class="f"><span>${l}</span><input type="time" data-k="${k}" value="${cur[k]}"></label>`;
const nm=(k,l,v,u)=>`<div class="f"><span>${l}</span><div class="nr"><input type="number" inputmode="numeric" min="0" data-k="${k}" value="${esc(cur[k])}" placeholder="0"><em>${u}</em></div><div class="ch">${v.map(x=>`<button type="button" data-set="${k}:${x}" class="${cur[k]==x&&cur[k]!==''?'on':''}">${x}</button>`).join('')}</div></div>`;
function form(){const c=cur;
 return `${strip()}<div class="card"><div class="nav"><button type="button" class="ar" data-day="-1" aria-label="Jour précédent">‹</button><label><span>Nuit se terminant le (jour du réveil)</span><input type="date" data-k="date" value="${c.date}"></label><button type="button" class="ar" data-day="1" aria-label="Jour suivant">›</button></div><p class="st" style="text-align:center;margin:8px 0 12px">${lg(c.date)}${entries[c.date]?' · déjà enregistrée':''}</p>
 <button class="btn" id="prev" type="button">↻ Reprendre l’habituel de la nuit précédente</button></div>
 <div class="card"><h2>🛏️ Coucher</h2><div class="g2">${tm('bed','Mise au lit')}${tm('try','Heure d’essai pour dormir')}</div>
 ${nm('lat','Temps estimé avant l’endormissement',[5,10,15,30,45,60,90],'min')}</div>
 <div class="card"><h2>🌙 Pendant la nuit</h2>
 ${nm('wakes','Nombre de réveils nocturnes',[0,1,2,3,4,5],'')}
 ${nm('wakeDur','Durée totale estimée des réveils',[0,5,10,20,30,45,60,90],'min')}</div>
 <div class="card"><h2>☀️ Matin</h2><div class="g2">${tm('wake','Réveil définitif')}${tm('up','Heure de lever')}</div></div>
 <div class="card"><h2>💤 Sieste(s)</h2>${c.naps.map((n,i)=>`<div class="row n"><input type="time" data-nap="${i}:h" value="${n.h}"><input type="number" inputmode="numeric" min="0" placeholder="min" data-nap="${i}:d" value="${esc(n.d)}"><button type="button" data-rm="naps:${i}">×</button></div>`).join('')}
 <button class="btn" type="button" data-add="naps">+ Ajouter une sieste</button></div>
 <div class="card"><h2>🎧 Conditions de sommeil</h2>
 <div class="f"><span>Fond sonore</span><div class="ch">${['oui','non'].map(x=>`<button type="button" data-tg="1" data-set="sound:${x}" class="${c.sound===x?'on':''}">${x}</button>`).join('')}</div>
 <input style="margin-top:8px" data-k="soundNote" placeholder="Précision (pluie, podcast…)" value="${esc(c.soundNote)}"><input type="url" inputmode="url" style="margin-top:8px" data-k="soundUrl" placeholder="Lien Spotify, YouTube…" value="${esc(c.soundUrl||'')}"><div id="sl">${slink(c.soundUrl)}</div></div>
 <div class="f"><span>Conditions inhabituelles</span><div class="ch">${ODD.map(x=>`<button type="button" data-odd="${x}" class="${c.odd.includes(x)?'on':''}">${x}</button>`).join('')}</div>
 <input style="margin-top:8px" data-k="oddNote" placeholder="Autre précision" value="${esc(c.oddNote)}"></div>
 <div class="f"><span>Donormyl ou autre produit : quantité et heure</span>${c.meds.map((m,i)=>`<div class="row"><input list="dl" data-med="${i}:n" placeholder="Produit" value="${esc(m.n)}"><input data-med="${i}:q" placeholder="Quantité" value="${esc(m.q)}"><input type="time" data-med="${i}:t" value="${m.t}"><button type="button" data-rm="meds:${i}">×</button></div>`).join('')}
 <button class="btn" type="button" data-add="meds">+ Ajouter un produit</button></div></div>
 <div class="card"><h2>⭐ Impression générale</h2><div class="ch feel">${FEEL.map(x=>`<button type="button" data-tg="1" data-set="feel:${x}" class="${c.feel===x?'on':''}">${{difficile:'😣',moyenne:'😐',bonne:'😊'}[x]} ${x}</button>`).join('')}</div>
 <label class="f" style="margin-top:12px"><span>Notes libres</span><textarea data-k="note">${esc(c.note)}</textarea></label></div>
 <div class="card" id="calc"></div>
 <button class="btn p" id="cp" type="button">Copier au format de ma note</button><a class="btn" id="hk" href="#">❤️ Envoyer vers Santé (Raccourcis)</a>

 else if(b.id==='prev'){const p=Object.keys(entries).sort().filter(x=>x<cur.date).pop();if(p){const o=entries[p];Object.assign(cur,{bed:o.bed,try:o.try,sound:o.sound,soundNote:o.soundNote,meds:clone(o.meds)});touch();render()}else b.textContent='Aucune nuit précédente'}
 else if(b.id==='cp')copy(noteText(cur),b);
 else if(b.id==='cpa')copy(Object.keys(entries).sort().map(k=>noteText(entries[k])).join('\n\n———\n\n'),b);
 else if(b.id==='csv')csv();
 else if(b.id==='bk')backup();
 else if(b.id==='rs')$('#rsf').click();
 else if(b.id==='del'){if(!delArm){delArm=true;b.textContent='Confirmer la suppression'}else{const k=cur.date;delete entries[k];(async()=>{try{if(store)await store.doc(k).delete();else localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}cur=blank(k);delArm=false;render();setStatus('Nuit supprimée')})()}}});
(async()=>{try{entries=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
 let m='ce navigateur uniquement';render();

    if(first){first=false;if(!isFilled(cur)&&o[cur.date])openDate(cur.date)}
