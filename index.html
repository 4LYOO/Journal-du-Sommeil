<style>
/* ---------- Thèmes ---------- */
:root{
 --bg:#f2f2f6;--tx:#121215;--mu:rgba(60,60,67,.64);--mu2:rgba(60,60,67,.32);
 --cd:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.74));--cdb:rgba(0,0,0,.06);--hi:rgba(255,255,255,1);
 --fld:rgba(118,118,128,.09);--fldb:rgba(0,0,0,.06);--ins:inset 0 1px 2px rgba(0,0,0,.06);
 --btn:linear-gradient(180deg,#fff,#f7f7fa);--inv:#17171a;--invt:#fff;--ring:rgba(0,0,0,.12);
 --sh:0 1px 2px rgba(20,20,40,.05),0 10px 24px -10px rgba(20,20,40,.14),0 28px 50px -30px rgba(20,20,40,.18);
 --tbg:rgba(250,250,252,.72);--pil:rgba(0,0,0,.07);--r1:#17171a;--r2:#8a8a92;
 --ok:#2f9a68;--wa:#c98a22;--ba:#cf4c58;--ac:#2c2c31;--bd:rgba(0,0,0,.12);
 --glow1:rgba(255,255,255,.9);--glow2:rgba(190,195,215,.35);color-scheme:light}
:root[data-theme="dark"]{
 --bg:#09090b;--tx:#f3f3f5;--mu:rgba(235,235,245,.56);--mu2:rgba(235,235,245,.24);
 --cd:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));--cdb:rgba(255,255,255,.075);--hi:rgba(255,255,255,.09);
 --fld:rgba(0,0,0,.32);--fldb:rgba(255,255,255,.06);--ins:inset 0 1px 3px rgba(0,0,0,.45);
 --btn:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));--inv:#ececf0;--invt:#0b0b0d;--ring:rgba(255,255,255,.16);
 --sh:0 1px 1px rgba(0,0,0,.35),0 14px 30px -12px rgba(0,0,0,.75),0 40px 70px -40px rgba(0,0,0,.9);
 --tbg:rgba(28,28,32,.62);--pil:rgba(255,255,255,.11);--r1:#f3f3f5;--r2:#6e6e78;
 --ok:#5cc395;--wa:#e2aa52;--ba:#ea7a84;--ac:#d9d9de;--bd:rgba(255,255,255,.14);
 --glow1:rgba(255,255,255,.07);--glow2:rgba(120,125,150,.10);color-scheme:dark}

/* ---------- Base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0}
body{color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;max-width:440px;margin:0 auto;
 padding:env(safe-area-inset-top,0px) 16px calc(112px + env(safe-area-inset-bottom,0px));
 background:radial-gradient(90% 45% at 50% -8%,var(--glow1),transparent 70%) fixed,radial-gradient(70% 40% at 100% 100%,var(--glow2),transparent 70%) fixed;-webkit-font-smoothing:antialiased}
button{touch-action:manipulation;font:inherit;color:inherit;cursor:pointer}
.i{display:block;flex:none}
.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.amb i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,var(--glow2),transparent 62%);animation:fl 26s ease-in-out infinite alternate;will-change:transform}
.amb i:nth-child(1){top:-30vmax;left:-25vmax}.amb i:nth-child(2){bottom:-35vmax;right:-30vmax;animation-delay:-13s}
@keyframes fl{to{transform:translate(10vmax,7vmax) scale(1.12)}}

/* ---------- En-tête ---------- */
.hd{display:flex;justify-content:space-between;align-items:center;padding:18px 0 4px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#eef3ff;
 background:linear-gradient(160deg,#2a3358,#0d0d12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -6px rgba(0,0,0,.6)}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
#mode{display:flex;align-items:center;gap:0;white-space:nowrap;color:var(--mu);font-size:.78rem;margin:2px 0 0}
#th{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--cdb);background:var(--btn);color:var(--tx);box-shadow:inset 0 1px 0 var(--hi),var(--sh)}
.st{color:var(--mu);font-size:.82rem;margin:0 0 10px;line-height:1.45}

/* ---------- Cartes ---------- */
main{padding-top:14px}
.card{position:relative;background:var(--cd);border:1px solid var(--cdb);border-radius:22px;padding:16px;margin-bottom:14px;
 box-shadow:inset 0 1px 0 var(--hi),var(--sh);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--tx);background:var(--btn);border:1px solid var(--cdb);box-shadow:inset 0 1px 0 var(--hi),0 3px 8px -3px rgba(0,0,0,.35)}

/* ---------- Champs ---------- */
.f{display:block;margin-bottom:14px}.f:last-child{margin-bottom:0}.f>span{display:block;font-size:.9rem;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--fld);border:1px solid var(--fldb);border-radius:12px;padding:11px 12px;min-height:46px;box-shadow:var(--ins);transition:box-shadow .2s,border-color .2s}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mu2)}
input:focus,textarea:focus,select:focus{outline:none;border-color:transparent;box-shadow:var(--ins),0 0 0 3px var(--ring)}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left}
.g2 .f{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.g2 .f span{margin:0;flex:1}.g2 .f input{width:140px;flex:none}
.g2+.f{margin-top:14px}
.nr{display:flex;align-items:center;gap:8px}.nr em{color:var(--mu);font-style:normal;font-size:.9rem}
.sep{height:1px;background:var(--cdb);margin:14px 0}

/* ---------- Puces et boutons ---------- */
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch button{border:1px solid var(--fldb);background:var(--fld);border-radius:999px;padding:7px 13px;font-size:.88rem;min-height:36px;box-shadow:var(--ins);transition:background .2s,color .2s,box-shadow .2s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.ch button.on{background:var(--inv);color:var(--invt);border-color:transparent;box-shadow:0 4px 12px -4px rgba(0,0,0,.45)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 4px;border-radius:14px;text-transform:capitalize}
.feel .dot{margin:0}
.feel button.on{color:#fff}.feel button.on .dot{background:#fff!important;opacity:.9}
.feel button[data-set="feel:difficile"].on{background:var(--ba)}.feel button[data-set="feel:moyenne"].on{background:var(--wa)}.feel button[data-set="feel:bonne"].on{background:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px;border-radius:14px;border:1px solid var(--cdb);background:var(--btn);color:var(--tx);font-weight:600;font-size:.95rem;text-decoration:none;box-shadow:inset 0 1px 0 var(--hi),0 4px 12px -6px rgba(0,0,0,.4)}
.btn+.btn{margin-top:8px}
.btn.p{background:var(--inv);color:var(--invt);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 10px 22px -10px rgba(0,0,0,.6)}
.btn.d{color:var(--ba)}
.btn.g{background:none;box-shadow:none;border-style:dashed;border-color:var(--bd);color:var(--mu);font-weight:500}
.acts{margin:4px 0 14px}
button,a.btn,.ar{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s,box-shadow .25s}
button:active,a.btn:active{transform:scale(.96)}
.lk{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:.88rem;padding:7px 12px;border-radius:999px;background:var(--btn);border:1px solid var(--cdb);box-shadow:inset 0 1px 0 var(--hi)}

/* ---------- Lignes siestes / produits ---------- */
.row{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:8px}.row:not(.n) input:first-child{grid-column:1/-1}
.row button{height:46px;border-radius:12px;border:1px solid var(--fldb);background:var(--fld);color:var(--ba);display:grid;place-items:center}

/* ---------- Sélecteur de jour ---------- */
.nav{display:flex;gap:10px;align-items:flex-end}.nav label{flex:1}.nav label span{display:block;font-size:.78rem;color:var(--mu);margin-bottom:6px}
.ar{width:46px;height:46px;border-radius:13px;border:1px solid var(--cdb);background:var(--btn);color:var(--tx);display:grid;place-items:center;box-shadow:inset 0 1px 0 var(--hi),0 4px 10px -5px rgba(0,0,0,.4)}
.strip{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 14px;margin:0 -2px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-width:50px;border:1px solid var(--cdb);background:var(--btn);border-radius:15px;padding:7px 4px 8px;font-size:.7rem;line-height:1.2;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:inset 0 1px 0 var(--hi),0 4px 10px -6px rgba(0,0,0,.4);text-transform:capitalize}
.strip button b{font-size:1.05rem;color:var(--tx);font-weight:600}
.strip button i{width:5px;height:5px;border-radius:50%;background:var(--mu2)}.strip button.ok i{background:var(--ok)}
.strip button.on{background:var(--inv);border-color:transparent;color:var(--invt)}.strip button.on b{color:var(--invt)}
.day{text-align:center;margin:12px 0 14px;color:var(--mu);font-size:.85rem;text-transform:capitalize}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:.72rem;background:var(--fld);border:1px solid var(--fldb);text-transform:none}

/* ---------- Résumé (anneau) ---------- */
.ringw{position:relative;width:160px;height:160px;margin:0 auto 16px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.ring{width:100%;transform:rotate(-90deg)}.rb{fill:none;stroke:var(--fld);stroke-width:10}
.rf{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.25,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-size:1.75rem;letter-spacing:-.03em;font-weight:700}.rc small{color:var(--mu);font-size:.72rem}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.calc>div{padding:10px 4px;border-radius:14px;background:var(--fld);border:1px solid var(--fldb);box-shadow:var(--ins)}
.calc b{display:block;font-size:1.12rem;font-weight:650;letter-spacing:-.02em}.calc small{color:var(--mu);font-size:.72rem}

/* ---------- Historique / stats ---------- */
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--cd);border:1px solid var(--cdb);border-radius:18px;padding:13px 14px;margin-bottom:8px;box-shadow:inset 0 1px 0 var(--hi),0 8px 18px -12px rgba(0,0,0,.6)}
.it b{font-weight:600;text-transform:capitalize}.it small{color:var(--mu)}
.it .r{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:.85rem;text-transform:capitalize}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:12px;padding:8px;border-radius:14px;background:var(--fld);border:1px solid var(--fldb);box-shadow:var(--ins)}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--ac);min-height:3px;opacity:.92;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.25,1.1) both}
.ax{display:flex;justify-content:space-between;color:var(--mu);font-size:.72rem;margin-top:6px}
.stk{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:4px 0 10px;box-shadow:var(--ins)}.stk i{display:block}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:8px}td,th{padding:9px 4px;border-bottom:1px solid var(--cdb);text-align:right;font-weight:500}td:first-child,th:first-child{text-align:left}th{color:var(--mu);font-size:.72rem;font-weight:600}
tr:last-child td{border-bottom:0}

/* ---------- Barre d'onglets ---------- */
.tbw{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.tb{position:relative;pointer-events:auto;max-width:410px;margin:0 auto;display:flex;padding:5px;border-radius:30px;touch-action:none;user-select:none;-webkit-user-select:none;
 background:var(--tbg);border:1px solid var(--cdb);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
 box-shadow:inset 0 1px 0 var(--hi),0 18px 40px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.15)}
.tb button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--mu);font-size:.66rem;font-weight:500;padding:8px 2px 7px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .25s}
.tb button.on,.tb button.hov{color:var(--tx);font-weight:600}
.tb.drag button.on:not(.hov){color:var(--mu);font-weight:500}
.pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:24px;background:var(--pil);box-shadow:inset 0 1px 0 var(--hi),0 4px 14px -4px rgba(0,0,0,.35);transition:transform .5s cubic-bezier(.3,1.35,.5,1),scale .25s}
.tb.drag .pill{transition:scale .25s;scale:1.06}
#sv{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:7px 14px;border-radius:999px;font-size:.8rem;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:21;
 background:var(--tbg);border:1px solid var(--cdb);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
#sv.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Animations ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{50%{transform:scale(1.07)}}
main.anim>*{animation:rise .5s cubic-bezier(.2,.9,.25,1.1) both}
main.anim>*:nth-child(2){animation-delay:.04s}main.anim>*:nth-child(3){animation-delay:.08s}main.anim>*:nth-child(4){animation-delay:.12s}main.anim>*:nth-child(5){animation-delay:.16s}main.anim>*:nth-child(n+6){animation-delay:.2s}
.ch button.on{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@media(prefers-reduced-motion:reduce){*,.amb i{animation:none!important;transition:none!important}}
</style></head><body><div class="amb"><i></i><i></i></div>

<script>

const ODD=['Bruit','Lumière','Inconfort','Chaleur','Froid','Stress','Écran tard','Repas tardif'];

function parseDate(s){const n=new Date();let m=s.match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/),d,mo,y=null;

function parseBlock(ls){const e=blank('');

function statsView(){const cut=shift(today(),1-rg),L=Object.keys(entries).sort().filter(d=>d>=cut).map(d=>({d,e:entries[d],s:stats(entries[d])}));
 const rc=`<div class="card"><div class="ch" style="margin:0">${[7,14,30,90].map(n=>`<button type="button" data-rg="${n}" class="${rg===n?'on':''}">${n} j</button>`).join('')}</div><small style="color:var(--mu);display:block;margin-top:10px">Couleur des barres : ${FEEL.map(f=>`<span class="dot" style="background:${FC[f]};margin-left:6px"></span>${f}`).join('')}</small></div>`;
 if(!L.length)return rc+'<div class="card">Aucune nuit sur cette période.</div>';
 const N=k=>x=>x.e[k]===''||x.e[k]==null?null:+x.e[k],mn=f=>mean(L.map(f)),R=(v,u,g)=>v==null?'–':(g?v.toFixed(1):Math.round(v))+u;
 const C=[[hm(mn(x=>x.s.sleep)),'sommeil'],[R(mn(N('lat')),' min'),'endormissement'],[R(mn(N('wakes')),'',1),'réveils / nuit'],[R(mn(x=>x.s.eff),' %'),'efficacité'],[tavg(L.map(x=>x.e.bed)),'coucher'],[tavg(L.map(x=>x.e.up)),'lever']];
 const ch=(t,f,fm)=>{const P=L.map(x=>({d:x.d,v:f(x),f:x.e.feel})).filter(p=>p.v!=null&&!isNaN(p.v));if(!P.length)return '';const mx=Math.max(1,...P.map(p=>p.v)),a=mean(P.map(p=>p.v));
  return `<div class="card"><h2>${t}</h2><small style="color:var(--mu)">Moyenne ${fm(a)} · max ${fm(mx)}</small><div class="bars">${P.map(p=>`<i title="${fd(p.d)} : ${fm(p.v)}" style="height:${Math.max(3,p.v/mx*100)}%;background:${FC[p.f]||'var(--ac)'}"></i>`).join('')}</div><div class="ax"><span>${fd(P[0].d).slice(0,5)}</span><span>${fd(P[P.length-1].d).slice(0,5)}</span></div></div>`};
 const n=FEEL.map(f=>L.filter(x=>x.e.feel===f).length),tot=n.reduce((a,b)=>a+b,0)||1;
 const rw=(l,g)=>{const m=mean(g.map(N('lat')));return `<tr><td>${l}</td><td>${g.length}</td><td>${hm(mean(g.map(x=>x.s.sleep)))}</td><td>${m==null?'–':Math.round(m)+' min'}</td></tr>`};
 const fs=x=>x.e.sound==='oui',md=x=>(x.e.meds||[]).length>0,sn=x=>(x.e.naps||[]).length>0,Y=f=>L.filter(f),Z=f=>L.filter(x=>!f(x));
 return rc+`<div class="card"><h2>Moyennes</h2><div class="calc" style="row-gap:16px">${C.map(c=>`<div><b>${c[0]}</b><small>${c[1]}</small></div>`).join('')}</div></div>`
 +ch('Sommeil estimé',x=>x.s.sleep,hm)+ch('Temps d’endormissement',N('lat'),v=>Math.round(v)+' min')+ch('Réveils nocturnes',N('wakes'),v=>v.toFixed(v%1?1:0))+ch('Efficacité du sommeil',x=>x.s.eff,v=>Math.round(v)+' %')
 +`<div class="card"><h2>Impression générale</h2><div class="stk">${FEEL.map((f,i)=>`<i style="width:${n[i]/tot*100}%;background:${FC[f]}"></i>`).join('')}</div><small style="color:var(--mu)">${FEEL.map((f,i)=>f+' '+n[i]).join(' · ')}</small></div>`
 +`<div class="card"><h2>Comparaisons</h2><table><tr><th></th><th>nuits</th><th>sommeil</th><th>endorm.</th></tr>${rw('Fond sonore',Y(fs))}${rw('Sans fond sonore',Z(fs))}${rw('Avec produit',Y(md))}${rw('Sans produit',Z(md))}${rw('Avec sieste',Y(sn))}${rw('Sans sieste',Z(sn))}</table><small style="color:var(--mu)">À lire avec prudence quand il y a peu de nuits.</small></div>`}
function render(){const ch=tab!==lt||fresh;fresh=false;if(tab!==lt){scrollTo(0,0);lt=tab}[1,2,3,4].forEach(n=>$('#t'+n).classList.toggle('on',tab==n));$('.pill').style.transform=`translateX(${(tab-1)*100}%)`;$('#app').classList.toggle('anim',ch);
 $('#app').innerHTML=tab==1?form():tab==2?hist():tab==3?statsView():importView();medNames();if(tab==1){calc();const s=$('.strip'),a=$('.strip .on');if(s&&a)s.scrollLeft=a.offsetLeft-s.clientWidth/2}$$('.bars i').forEach((b,i)=>b.style.animationDelay=Math.min(i*20,600)+'ms')}
async function csv(){const H=['date','mise_au_lit','essai_dormir','latence_min','reveils','duree_reveils_min','reveil_definitif','lever','siestes','fond_sonore','conditions','produits','impression','sommeil_estime_min','efficacite_pct','notes'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=Object.keys(entries).sort().map(d=>{const e=entries[d],s=stats(e);return [d,e.bed,e.try,e.lat,e.wakes,e.wakeDur,e.wake,e.up,e.naps.map(n=>n.h+' '+n.d).join(';'),e.sound+(e.soundNote?' '+e.soundNote:'')+(e.soundUrl?' '+e.soundUrl:''),[...e.odd,e.oddNote].filter(Boolean).join(';'),e.meds.map(m=>[m.n,m.q,m.t].join(' ')).join(';'),e.feel,s.sleep,s.eff,e.note].map(q).join(',')});
 const b=new Blob(['\ufeff'+H.join(',')+'\n'+rows.join('\n')],{type:'text/csv'});try{await saveFile(b,'journal-sommeil.csv')}catch(e){}}
const app=$('#app');
[['edit','Saisie'],['cal','Historique'],['chart','Stats'],['imp','Importer']].forEach(([n,l],i)=>{const b=$('#t'+(i+1));b.innerHTML=ic(n,22,1.6)+l;b.onclick=()=>{tab=i+1;render()}});
$('#lg').innerHTML=ic('moon',20,1.8);
function setTheme(n){document.documentElement.dataset.theme=n;$('#th').innerHTML=ic(n==='dark'?'sun':'moon',18);$('meta[name=theme-color]').content=n==='dark'?'#09090b':'#f2f2f6'}
let th0='dark';try{th0=localStorage.getItem('sommeil-th')||'dark'}catch(e){}setTheme(th0);
$('#th').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(n);try{localStorage.setItem('sommeil-th',n)}catch(e){}};
// Glisser le doigt le long de la barre du bas pour changer d'onglet
(()=>{const tb=$('.tb'),pill=$('.pill'),bs=$$('.tb button');let d=null,skip=false;
 const at=x=>{const w=(d.r.width-10)/4,p=Math.max(0,Math.min(3*w,x-d.r.left-5-w/2));return {p,i:Math.round(p/w)+1}};
 tb.addEventListener('pointerdown',e=>{d={x0:e.clientX,r:tb.getBoundingClientRect(),id:e.pointerId,on:false}});
 tb.addEventListener('pointermove',e=>{if(!d)return;if(!d.on){if(Math.abs(e.clientX-d.x0)<8)return;d.on=true;try{tb.setPointerCapture(d.id)}catch(x){}tb.classList.add('drag')}
  const {p,i}=at(e.clientX);pill.style.transform=`translateX(${p}px)`;bs.forEach((b,j)=>b.classList.toggle('hov',j+1===i))});
 const end=e=>{if(!d)return;const was=d.on;if(was){tab=at(e.clientX).i;skip=true;setTimeout(()=>skip=false,80)}d=null;tb.classList.remove('drag');bs.forEach(b=>b.classList.remove('hov'));if(was)render()};
 tb.addEventListener('pointerup',end);tb.addEventListener('pointercancel',end);
 tb.addEventListener('click',e=>{if(skip){e.stopPropagation();e.preventDefault()}},true)})();
app.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.k&&t.dataset.k!=='date'){cur[t.dataset.k]=t.value;touch();calc();if(t.dataset.k==='soundUrl')$('#sl').innerHTML=slink(t.value);if(['lat','wakeDur'].includes(t.dataset.k))$$('[data-set^="'+t.dataset.k+':"]').forEach(b=>b.classList.toggle('on',b.dataset.set===t.dataset.k+':'+t.value))}
 else if(t.dataset.nap){const[i,f]=t.dataset.nap.split(':');cur.naps[i][f]=t.value;touch()}
 else if(t.dataset.med){const[i,f]=t.dataset.med.split(':');cur.meds[i][f]=t.value;touch()}});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='rsf'){if(t.files[0])restore(t.files[0]);t.value='';return}if(t.dataset.bd!=null){imp.blocks[t.dataset.bd].date=t.value;return}if(t.dataset.k==='date'&&t.value){clearTimeout(tmr);save().then(()=>{openDate(t.value);render()})}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.day)go(shift(cur.date,+d.day));else if(d.goto)go(d.goto);else if(d.rg){rg=+d.rg;render()}else if(d.im){imp.text=$('#impt').value;imp.mode=d.im;if(imp.text.trim())imp.blocks=parseNotes(imp.text);render()}else if(b.id==='parse')doParse();else if(b.id==='doimp')doImport(b);else if(d.set){const[k,v]=d.set.split(':');cur[k]=(d.tg&&cur[k]===v)?'':v;$$('button',b.parentNode).forEach(x=>x.classList.toggle('on',x.dataset.set===k+':'+cur[k]));const i=$('input[data-k="'+k+'"]');if(i)i.value=cur[k];touch();calc()}
 else if(d.odd){const i=cur.odd.indexOf(d.odd);i<0?cur.odd.push(d.odd):cur.odd.splice(i,1);b.classList.toggle('on',i<0);touch()}
 else if(d.add){cur[d.add].push(d.add==='naps'?{h:'',d:''}:{n:'',q:'',t:''});render()}
 else if(d.rm){const[k,i]=d.rm.split(':');cur[k].splice(i,1);touch();render()}
 else if(d.open){openDate(d.open);tab=1;render();scrollTo(0,0)}
 else if(b.id==='prev'){const p=Object.keys(entries).sort().filter(x=>x<cur.date).pop();if(p){const o=entries[p];Object.assign(cur,{bed:o.bed,try:o.try,sound:o.sound,soundNote:o.soundNote,meds:clone(o.meds)});touch();render()}else b.textContent='Aucune nuit précédente'}
 else if(b.id==='cp')copy(noteText(cur),b);
 else if(b.id==='cpa')copy(Object.keys(entries).sort().map(k=>noteText(entries[k])).join('\n\n———\n\n'),b);
 else if(b.id==='csv')csv();
 else if(b.id==='bk')backup();
 else if(b.id==='rs')$('#rsf').click();
 else if(b.id==='del'){if(!delArm){delArm=true;b.textContent='Confirmer la suppression'}else{const k=cur.date;delete entries[k];(async()=>{try{if(store)await store.doc(k).delete();else localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}cur=blank(k);delArm=false;render();setStatus('Nuit supprimée')})()}}});
(async()=>{try{entries=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
 let m='ce navigateur uniquement';render();
 try{if(window.claude){const u=await claude.use('user'),db=await claude.use('db');const id=u&&await u.id();
  if(db&&id){store=db.collection('data/users/'+id+'/nuits/items');const loc=entries;Object.keys(loc).forEach(k=>store.doc(k).set(loc[k]));if(Object.keys(loc).length)try{localStorage.removeItem(KEY)}catch(x){}let first=true;
   store.onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());entries=o;
    if(first){first=false;if(!isFilled(cur)&&o[cur.date])openDate(cur.date)}
    if(tab==2||tab==3)render();else medNames()});m='compte, privé'}}}catch(e){}
 $('#mode').innerHTML=store?'<span class="dot" style="background:var(--ok)"></span>Synchronisé avec votre compte':'<span class="dot" style="background:var(--wa)"></span>Sur cet appareil · pensez à sauvegarder';render()})();
